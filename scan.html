<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Key Engineering – Equipment status</title>
<style>
:root{--ink:#14202b;--mut:#5b6b78;--line:#dde3e8;--bg:#f3f5f7;--ok:#1f8a4c;--warn:#d98e04;--bad:#c0392b;--brand:#0b3a5b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:18px 16px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;opacity:.8;font-size:13px}
main{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.eq{font-size:20px;font-weight:700}.sub{color:var(--mut);font-size:14px;margin-top:2px}
.badge{display:inline-block;padding:6px 12px;border-radius:99px;color:#fff;font-weight:700;font-size:14px;margin-top:10px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.none{background:var(--mut)}
dl{margin:0}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
dt{color:var(--mut)}dd{margin:0;font-weight:600;text-align:right}
.btnf{display:block;width:100%;border:0;border-radius:12px;background:var(--bad);color:#fff;font-weight:700;font-size:17px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input[type=text],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px}
textarea{min-height:90px}.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600}.chk input{width:22px;height:22px}
.send{display:block;width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:16px;padding:14px;margin-top:16px}.err{color:var(--bad);font-size:14px;margin-top:10px}.note{background:#fff4d6;border:1px solid #f0c75e;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.4}.hp{position:absolute;left:-9999px}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:18px;line-height:1.5}
</style></head><body>
<header><h1>Key Engineering Chesterfield</h1><p>Equipment status</p></header>
<main id="m"><div class="card">Checking…</div></main>
<script>
var API='https://eyerpokgadrgxticqzez.supabase.co/functions/v1/scan';
var q=new URLSearchParams(location.search),m=document.getElementById('m');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){if(!d)return '—';var x=new Date(d+'T00:00:00');return isNaN(x)?'—':x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function foot(){return '<p class="foot">For repairs, servicing or examinations call Key Engineering Chesterfield.</p>'}
fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:q.get('c'),n:q.get('n'),i:q.get('i')})})
.then(function(r){return r.json()}).then(function(j){
 if(!j.found){m.innerHTML='<div class="card"><div class="eq">No record found</div><div class="sub">We could not find this equipment. Please contact Key Engineering.</div></div>'+foot();return}
 var TL={Service:'Service',Inspection:'Inspection',LOLER:'LOLER examination'};
 var due=j.next_due,cls='none',txt='No due date on file',dl=TL[j.next_due_type]||'Next visit';
 if(due){var days=Math.ceil((new Date(due+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
  if(days<0){cls='bad';txt=dl+' overdue'}else if(days<=30){cls='warn';txt=dl+' due within '+days+' day'+(days==1?'':'s')}else{cls='ok';txt=dl+' in date'}}
 var lt=TL[j.last_visit_type]||j.last_visit_type||'Visit';
 var rows='<div class="row"><dt>Last visit</dt><dd>'+esc(lt)+'<br>'+fmt(j.last_visit_date)+'</dd></div>';
 if(due) rows+='<div class="row"><dt>Next '+esc(dl.toLowerCase())+' due</dt><dd>'+fmt(due)+'</dd></div>';
 [['Last LOLER examination',j.last_loler,j.loler_due],['Last inspection',j.last_inspection,j.inspection_due],['Last service',j.last_service,j.service_due]].forEach(function(x){
  if(x[1]) rows+='<div class="row"><dt>'+x[0]+'</dt><dd>'+fmt(x[1])+(x[2]?'<br><span style="font-weight:400;color:var(--mut)">next due '+fmt(x[2])+'</span>':'')+'</dd></div>'});
 m.innerHTML='<div class="card"><div class="eq">'+esc(j.crane_no||'Equipment')+'</div><div class="sub">ID: '+esc(j.id_no||'\u2014')+'</div><span class="badge '+cls+'">'+txt+'</span></div>'+
 '<div class="card"><dl>'+rows+'</dl></div>'+faultUi()+foot();
}).catch(function(){m.innerHTML='<div class="card"><div class="eq">Could not load</div><div class="sub">Check your signal and scan again.</div></div>'+foot()});

function faultUi(){return '<button class="btnf" id="fb">\u26a0\ufe0f Report a fault</button><div class="card" id="ff" style="display:none"><div class="eq" style="font-size:18px">Report a fault</div><div class="sub">This goes straight to the Key Engineering office. The time and date are added automatically.</div><div class="note"><b>Important:</b> please also tell your supervisor or maintenance department about this fault straight away, and do not use the crane until it has been checked.</div>'+
 '<label>Your name</label><input type="text" id="fn" autocomplete="name"><label>Phone number (optional)</label><input type="tel" id="fp" autocomplete="tel"><label>What is wrong?</label><textarea id="fw" maxlength="600"></textarea>'+
 '<label class="chk"><input type="checkbox" id="fs"> Crane stopped / taken out of use</label><input class="hp" id="fh" tabindex="-1" autocomplete="off"><div class="err" id="fe"></div><button class="send" id="fx">Send to Key Engineering</button></div>'}
document.addEventListener('click',function(e){
 if(e.target.id==='fb'){document.getElementById('ff').style.display='block';e.target.style.display='none';document.getElementById('fn').focus()}
 if(e.target.id==='fx'){var b=e.target,er=document.getElementById('fe');er.textContent='';
  var nm=document.getElementById('fn').value.trim(),wh=document.getElementById('fw').value.trim();
  if(!nm){er.textContent='Please enter your name.';return}if(!wh){er.textContent='Please describe the fault.';return}
  b.disabled=true;b.textContent='Sending\u2026';
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:q.get('c'),n:q.get('n'),i:q.get('i'),action:'fault',name:nm,phone:document.getElementById('fp').value,what:wh,stopped:document.getElementById('fs').checked,website:document.getElementById('fh').value})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})}).then(function(x){
   if(x.ok&&x.j.ok){document.getElementById('ff').innerHTML='<div class="eq" style="color:var(--ok)">\u2705 Sent</div><div class="sub" style="margin-top:6px">Key Engineering have been alerted and will be in touch. <b>Please also tell your supervisor or maintenance department now.</b> If it is dangerous, keep clear of the crane and call us now.</div>'}
   else{er.textContent=(x.j&&x.j.error)||'Could not send. Please call Key Engineering.';b.disabled=false;b.textContent='Send to Key Engineering'}
  }).catch(function(){er.textContent='No signal \u2014 please try again or call Key Engineering.';b.disabled=false;b.textContent='Send to Key Engineering'})}
});
</script></body></html>
