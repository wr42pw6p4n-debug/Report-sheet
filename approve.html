<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Key Engineering — Approve repairs</title>
<link rel="icon" href="favicon-32.png">
<style>
  :root{--bg:#f1f3f6;--card:#fff;--ink:#161b22;--soft:#5a6572;--line:#d7dce2;--steel:#161b22;--steel2:#2a3340;--yellow:#f2b800;--red:#d81e2c;--green:#1c9c4a}
  *{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{background:linear-gradient(180deg,var(--steel),var(--steel2));color:#fff;padding:16px;border-bottom:4px solid var(--yellow)}
  header .in{max-width:760px;margin:0 auto}header h1{font-size:18px;margin:0}header p{margin:2px 0 0;font-size:13px;opacity:.8}
  main{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  h2{margin:0 0 4px;font-size:20px}.soft{color:var(--soft);font-size:14px}
  .item{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .item b{display:block}.item .n{font-size:14px;color:var(--soft);margin-top:2px}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-right:6px;color:#fff;background:#e08a1c}.tag.u{background:var(--red)}
  .ch{display:flex;gap:8px;margin-top:10px}
  .ch button{flex:1;padding:12px;border-radius:9px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;color:var(--soft)}
  .ch button.on.a{background:var(--green);border-color:var(--green);color:#fff}.ch button.on.d{background:var(--red);border-color:var(--red);color:#fff}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--soft);margin:14px 0 5px}
  input,textarea{width:100%;padding:12px;font:inherit;font-size:17px;border:1.5px solid var(--line);border-radius:9px}
  .btn{width:100%;margin-top:18px;padding:15px;border:0;border-radius:10px;background:var(--steel);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
  .btn:disabled{opacity:.5}.err{color:var(--red);font-weight:600;margin-top:12px}
  .all{display:flex;gap:8px;margin-top:12px}.all button{flex:1;padding:10px;border:1.5px solid var(--steel);background:#fff;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
  .done{border-color:var(--green);background:#f1faf4}
</style>
</head>
<body>
<header><div class="in"><h1>KEY ENGINEERING</h1><p>Approve repairs</p></div></header>
<main id="app"><div class="card">Loading…</div></main>
<script>
var API='https://eyerpokgadrgxticqzez.supabase.co/functions/v1/repair-approval';
var KEY='sb_publishable_FsyUdlUOTgA51pkAy5pNiA_AsHqq6Ed';
var token=(new URLSearchParams(location.search).get('t')||'').trim();
var A=document.getElementById('app'), data=null, dec={};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function call(body){ body.token=token; return fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Something went wrong.'); return j; });}); }
function fail(m){ A.innerHTML='<div class="card"><h2>Sorry</h2><p>'+esc(m)+'</p><p class="soft">Please contact Key Engineering and we will help.</p></div>'; }
function when(s){ try{ return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } }
function show(){
  var d=data, isDone=d.status==='answered';
  var h='<div class="card"><h2>'+esc(d.customer)+'</h2><div class="soft">'+(d.site?esc(d.site)+' · ':'')+'Repairs found on inspection</div>';
  if(isDone){
    var a=d.items.filter(function(i){return i.decision==='accept';}).length;
    h+='<p style="margin:12px 0 0"><b>Thank you. We received your answer'+(d.answered_by?' from '+esc(d.answered_by):'')+(d.answered_at?' on '+when(d.answered_at):'')+'.</b> '+a+' of '+d.items.length+' repairs accepted'+(d.po_number?' (PO '+esc(d.po_number)+')':'')+'. Key Engineering will be in touch to book the work in.</p></div>';
    h+=d.items.map(function(i){return '<div class="card '+(i.decision==='accept'?'done':'')+'" style="padding:12px"><b>'+esc(i.crane?i.crane+' – ':'')+esc(i.group)+(i.group&&i.label?' – ':'')+esc(i.label)+'</b><div class="soft">'+(i.decision==='accept'?'✔ Accepted':'✖ Declined')+'</div></div>';}).join('');
    if(!d.locked) h+='<p class="soft">Need to change your answer? <a href="#" id="chg">Tap here</a>.</p>'; else h+='<p class="soft">To change anything, please call Key Engineering.</p>';
    A.innerHTML=h; var c=document.getElementById('chg'); if(c) c.onclick=function(e){e.preventDefault(); data.status='sent'; show();}; return;
  }
  h+='<p class="soft" style="margin:10px 0 0">Please choose <b>Accept</b> or <b>Decline</b> for each repair below, then press Send. Accepted repairs will be booked in with you.</p>';
  h+='<div class="all"><button type="button" id="allA">Accept all</button><button type="button" id="allD">Decline all</button></div></div>';
  d.items.forEach(function(i,n){
    h+='<div class="item card" style="margin-bottom:0;margin-top:10px"><b>'+(i.urgent?'<span class="tag u">URGENT</span>':'<span class="tag">ATTENTION</span>')+esc(i.crane?i.crane+' – ':'')+esc(i.group)+(i.group&&i.label?' – ':'')+esc(i.label)+'</b>'+(i.note?'<div class="n">'+esc(i.note)+'</div>':'')+'<div class="ch"><button type="button" data-n="'+n+'" data-v="accept" class="a">Accept</button><button type="button" data-n="'+n+'" data-v="decline" class="d">Decline</button></div></div>';
  });
  h+='<div class="card" style="margin-top:14px"><label>Your name</label><input id="nm" autocomplete="name" placeholder="Who is approving?"><label>Your PO number (if you have one)</label><input id="po" placeholder="Optional"><label>Anything else we should know?</label><textarea id="nt" rows="3" placeholder="Optional"></textarea><div class="err" id="er"></div><button class="btn" id="go">Send my answer</button></div>';
  A.innerHTML=h;
  function paint(){ A.querySelectorAll('.ch button').forEach(function(b){ var on=dec[b.dataset.n]===b.dataset.v; b.className=(b.dataset.v==='accept'?'a':'d')+(on?' on':''); }); }
  A.querySelectorAll('.ch button').forEach(function(b){ b.onclick=function(){ dec[b.dataset.n]=b.dataset.v; paint(); }; });
  document.getElementById('allA').onclick=function(){ d.items.forEach(function(_,n){dec[n]='accept';}); paint(); };
  document.getElementById('allD').onclick=function(){ d.items.forEach(function(_,n){dec[n]='decline';}); paint(); };
  paint();
  document.getElementById('go').onclick=function(){
    var er=document.getElementById('er'), b=this; er.textContent='';
    if(d.items.some(function(_,n){return !dec[n];})) { er.textContent='Please choose Accept or Decline for every repair.'; return; }
    var nm=document.getElementById('nm').value.trim(); if(!nm){ er.textContent='Please type your name.'; return; }
    b.disabled=true; b.textContent='Sending…';
    call({action:'respond',decisions:dec,name:nm,po_number:document.getElementById('po').value,note:document.getElementById('nt').value})
      .then(function(){ return call({action:'get'}); }).then(function(j){ data=j; show(); window.scrollTo(0,0); })
      .catch(function(e){ er.textContent=e.message; b.disabled=false; b.textContent='Send my answer'; });
  };
}
if(!token) fail('This link is not complete.');
else call({action:'get'}).then(function(j){ data=j; j.items.forEach(function(i,n){ if(i.decision) dec[n]=i.decision; }); show(); }).catch(function(e){ fail(e.message); });
</script>
</body>
</html>
